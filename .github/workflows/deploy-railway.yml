name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Railway token
        id: check
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RAILWAY_TOKEN is not set. Skipping Railway deploy."
            echo "Connect the repo in Railway (recommended) or add RAILWAY_TOKEN. See RAILWAY_SETUP_GUIDE.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        if: steps.check.outputs.configured == 'true'
        run: dotnet restore backend/SystemDesignSimulator.Api

      - name: Build
        if: steps.check.outputs.configured == 'true'
        run: dotnet build backend/SystemDesignSimulator.Api --configuration Release --no-restore

      - name: Install Railway CLI
        if: steps.check.outputs.configured == 'true'
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        if: steps.check.outputs.configured == 'true'
        run: railway up --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
