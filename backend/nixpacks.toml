[phases.setup]
nixPkgs = ['dotnet-sdk-8']

[phases.install]
cmds = ['cd SystemDesignSimulator.Api && dotnet restore']

[phases.build]
cmds = ['cd SystemDesignSimulator.Api && dotnet publish -c Release -o out']

[start]
cmd = 'cd SystemDesignSimulator.Api/out && dotnet SystemDesignSimulator.Api.dll --urls http://0.0.0.0:$PORT'
