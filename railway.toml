# Frontend service config for Railway.
# Point this service at: /railway.toml (absolute path in service settings)
# Docs: https://docs.railway.com/config-as-code

[build]
buildCommand = "npm ci && npm run build"
watchPatterns = ["src/**", "public/**", "index.html", "package.json", "vite.config.ts"]

[deploy]
startCommand = "npm run preview -- --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
