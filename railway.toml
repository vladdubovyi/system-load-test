# Frontend service config for Railway.
# Point this service at: /railway.toml (absolute path in service settings)
# Docs: https://docs.railway.com/config-as-code
#
# Recommended variables (then redeploy frontend so Vite embeds build-time values):
#   VITE_API_URL=https://${{backend.RAILWAY_PUBLIC_DOMAIN}}
#   VITE_GOOGLE_CLIENT_ID=<google-oauth-client-id>
#   VITE_BASE=/   # optional; "/" is the default for non-GitHub-Pages builds

[build]
buildCommand = "npm run build"
watchPatterns = ["src/**", "public/**", "index.html", "package.json", "vite.config.ts"]

[deploy]
startCommand = "npm run preview -- --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
