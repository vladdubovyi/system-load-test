# Render Blueprint for BreakIT
# Visit https://render.com to deploy

services:
  # Backend API — database-free (docs/specs/interview-platform.md §2.3)
  - type: web
    name: systemdesignsim-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: CORS_ORIGINS
        value: https://systemdesignsim.vercel.app
    buildCommand: ""
    startCommand: dotnet SystemDesignSimulator.Api.dll
    healthCheckPath: /api/health

  # Frontend (Static Site)
  - type: web
    name: systemdesignsim-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: VITE_API_URL
        value: https://systemdesignsim-api.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
