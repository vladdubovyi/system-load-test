# Render Blueprint for System Design Simulator
# Visit https://render.com to deploy

services:
  # PostgreSQL Database
  - type: pgsql
    name: systemdesignsim-db
    databaseName: systemdesignsim
    plan: free
    region: oregon
    ipAllowList: []

  # Backend API
  - type: web
    name: systemdesignsim-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: systemdesignsim-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://systemdesignsim.vercel.app
    buildCommand: ""
    startCommand: dotnet SystemDesignSimulator.Api.dll
    healthCheckPath: /health

  # Frontend (Static Site)
  - type: web
    name: systemdesignsim-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: VITE_API_URL
        value: https://systemdesignsim-api.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
